# Render Blueprint: one free web service that builds the game and runs the game server.
# In Render: New → Blueprint → pick this repository. See "Hosting on Render" in README.md.
services:
  - type: web
    name: iron-front
    runtime: node
    plan: free
    # --include=dev: the build needs TypeScript, Vite and esbuild even if NODE_ENV is production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      # Key that seals saved online matches. Render makes a random one once; changing
      # or deleting it later means older save files can no longer be opened.
      - key: SAVE_SECRET
        generateValue: true
